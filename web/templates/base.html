<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}打印监控{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/bootstrap.min.css').path }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css').path }}">
</head>
<body>
<header class="border-bottom">
  <nav class="container-fluid page-width d-flex align-items-center justify-content-between flex-wrap gap-3 py-3" aria-label="主导航">
    <div class="d-flex align-items-center gap-4 flex-wrap">
      <span class="site-name fw-bold fs-5">🍝 炒面监控</span>
      <a href="/status" class="nav-item {% if tab == 'status' %}active{% endif %}" {% if tab == 'status' %}aria-current="page"{% endif %}>打印机状态</a>
      <a href="/photos" class="nav-item {% if tab == 'photos' %}active{% endif %}" {% if tab == 'photos' %}aria-current="page"{% endif %}>照片记录</a>
      <a href="/jetson" class="nav-item {% if tab == 'jetson' %}active{% endif %}" {% if tab == 'jetson' %}aria-current="page"{% endif %}>Jetson 监控</a>
    </div>
    <div>
      <a href="/login" class="nav-item d-inline-flex align-items-center gap-2 {% if tab == 'login' %}active{% endif %}" {% if tab == 'login' %}aria-current="page"{% endif %}>
        {% if is_connected %}
          <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-2 py-1">● 已连接 A1</span>
        {% else %}
          <span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill px-2 py-1">● 未连接</span>
        {% endif %}
        <span>设备连接</span>
      </a>
    </div>
  </nav>
</header>
<main class="container-fluid page-width py-4">{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
